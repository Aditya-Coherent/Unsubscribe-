<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Unsubscribe · Coherent Market Insights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Slab:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#002060;--prussian:#112A54;--green:#70AD47;--magenta:#C0398B;
    --ink:#212529;--paper:#FFFFFF;--bg:#EEF1F6;--muted:#5B6470;--faint:#8A93A3;
    --hair:#E1E6EF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--bg);color:var(--ink);font-family:"Roboto",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 14px;}
  .card{width:100%;max-width:480px;background:var(--paper);border:1px solid var(--hair);border-radius:10px;overflow:hidden;box-shadow:0 6px 24px rgba(0,32,96,.06);}
  .bar{height:4px;background:linear-gradient(90deg,var(--navy),var(--green));}
  .inner{padding:32px 28px 28px;}
  .brand{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);margin:0 0 18px;}
  h1{font-family:"Roboto Slab",Georgia,serif;font-weight:700;font-size:24px;line-height:1.2;letter-spacing:-.01em;color:var(--navy);margin:0 0 8px;}
  p.lead{color:var(--muted);margin:0 0 22px;font-size:15px;}
  label{display:block;font-size:13px;font-weight:500;color:var(--prussian);margin:0 0 6px;}
  input[type=email],select{width:100%;font:inherit;font-size:15px;color:var(--ink);background:#fff;border:1px solid #CBD3E1;border-radius:6px;padding:11px 12px;margin:0 0 16px;outline:none;transition:border-color .15s,box-shadow .15s;}
  input[type=email]:focus,select:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(0,32,96,.12);}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;}
  button{width:100%;font:inherit;font-weight:500;font-size:15px;color:#fff;background:var(--navy);border:0;border-radius:6px;padding:12px 16px;cursor:pointer;transition:background .15s;}
  button:hover{background:var(--prussian);}
  button:disabled{opacity:.6;cursor:default;}
  .msg{margin:14px 0 0;font-size:14px;min-height:1.2em;}
  .msg.err{color:#B3261E;}
  .done{display:none;text-align:center;}
  .done .tick{width:48px;height:48px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 14px;}
  .done p{color:var(--muted);margin:0;}
  footer{margin-top:18px;font-size:12px;color:var(--faint);text-align:center;}
</style>
</head>
<body>
  <main class="card">
    <div class="bar"></div>
    <div class="inner">
      <p class="brand">Coherent Market Insights</p>

      <section id="form-view">
        <h1>Unsubscribe from our briefs</h1>
        <p class="lead">Confirm your email address and we&rsquo;ll stop sending you market intelligence briefs.</p>
        <form id="unsub-form" novalidate>
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="you@company.com" required>

          <label for="reason">Reason (optional)</label>
          <select id="reason" name="reason">
            <option value="">Prefer not to say</option>
            <option>Too many emails</option>
            <option>Content isn&rsquo;t relevant to me</option>
            <option>I never signed up</option>
            <option>Other</option>
          </select>

          <div class="hp" aria-hidden="true">
            <label for="website">Website</label>
            <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
          </div>

          <button type="submit" id="submit">Unsubscribe</button>
          <p class="msg" id="msg" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="done" id="done-view">
        <div class="tick">&#10003;</div>
        <h1>You&rsquo;re unsubscribed</h1>
        <p><span id="done-email"></span> won&rsquo;t receive any more briefs from us.</p>
      </section>
    </div>
  </main>
  <footer>&copy; Coherent Market Insights</footer>

<script>
  (function () {
    var form = document.getElementById('unsub-form');
    var emailEl = document.getElementById('email');
    var msg = document.getElementById('msg');
    var btn = document.getElementById('submit');

    // Prefill from the newsletter link: /?email=someone@company.com
    var params = new URLSearchParams(location.search);
    var pre = params.get('email');
    if (pre) emailEl.value = pre.trim();

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      msg.className = 'msg';
      msg.textContent = '';

      var email = emailEl.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        msg.className = 'msg err';
        msg.textContent = 'Please enter a valid email address.';
        emailEl.focus();
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Unsubscribing…';

      fetch('/api/unsubscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: email,
          reason: document.getElementById('reason').value,
          website: document.getElementById('website').value,
          source: params.get('src') || ''
        })
      })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
        .then(function (res) {
          if (!res.ok) throw new Error(res.data.error || 'Something went wrong.');
          document.getElementById('done-email').textContent = email;
          document.getElementById('form-view').style.display = 'none';
          document.getElementById('done-view').style.display = 'block';
        })
        .catch(function (err) {
          msg.className = 'msg err';
          msg.textContent = err.message || 'Something went wrong. Please try again.';
          btn.disabled = false;
          btn.textContent = 'Unsubscribe';
        });
    });
  })();
</script>
</body>
</html>
